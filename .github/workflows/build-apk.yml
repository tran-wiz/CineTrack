name: Build Android APK

on:
  push:
    branches: [ main, master, aistudio-preview ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'
      - '*.jpg'
      - '*.png'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14'

      - name: Restore google-services.json from GitHub Secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON || vars.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            case "$(printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '[:space:]' | cut -c1)" in
              "{") printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json ;;
              *)   printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json ;;
            esac
          fi
          if [ ! -s app/google-services.json ]; then
            echo "::error::Missing app/google-services.json. Add the contents of app/google-services.json as a Repository Secret named GOOGLE_SERVICES_JSON in GitHub (Settings -> Secrets and variables -> Actions -> Repository secrets)."
            exit 1
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: MovieTracker-APK
          path: app/build/outputs/apk/debug/app-debug.apk
